<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 310" role="img" aria-labelledby="title">
  <title id="title">DreamSoft logo</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
